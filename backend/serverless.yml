service: wage-fairness-api
provider:
  name: aws
  runtime: python3.9
  region: ap-southeast-2
package:
  exclude:
    - test.py
    - test2.py
functions:
  calculate:
    handler: handler.lambda_handler
    events:
      - http:
          path: fairness/calculate
          method: post
          cors: true
 
  gender-gap:
    handler: gender_gap_handler.calculate_gender_gap
    events:
      - http:
          path: gender-gap/calculate
          method: post
          cors: true
          
  suburb-score:
    handler: suburb_scoring_handler.score_suburb
    events:
      - http:
          path: suburb/score
          method: post
          cors: true
          
  ai-chat:
    handler: AI_chat.lambda_handler
    events:
      - http:
          path: ai/chat
          method: post
          cors: true
    timeout: 30
    environment:
      ZHIPU_API_KEY: ${env:9405476aa25d42a580409da4546dba36.TStXLwwhiycqtLeP}