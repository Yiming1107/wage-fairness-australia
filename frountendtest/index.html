<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Negotiation Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #f8f9fa;
            border-radius: 16px 16px 0 0;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .boss-selector {
            display: flex;
            gap: 10px;
        }

        .boss-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .boss-btn:hover {
            background: #f0f0f0;
        }

        .boss-btn.active {
            background: #667eea;
            color: white;
        }

        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #667eea;
        }

        .message.ai .avatar {
            background: #e0e0e0;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: #f8f9fa;
            border-radius: 0 0 16px 16px;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #userInput:focus {
            border-color: #667eea;
        }

        #sendBtn {
            padding: 12px 32px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }

        #sendBtn:hover:not(:disabled) {
            background: #5568d3;
        }

        #sendBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: flex;
            gap: 4px;
            padding: 8px;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading span:nth-child(1) { animation-delay: -0.32s; }
        .loading span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .user-info {
            padding: 10px 20px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            margin: 10px 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Salary Negotiation Practice</h1>
            <div class="boss-selector">
                <button class="boss-btn active" data-type="supportive">Supportive Boss</button>
                <button class="boss-btn" data-type="skeptical">Skeptical Boss</button>
                <button class="boss-btn" data-type="budget_focused">Budget-Focused Boss</button>
            </div>
        </div>

        <div class="user-info">
            💼 Current Salary: $8,000 | Market Average: $12,000 | Experience: 3 years
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message ai">
                <div class="avatar">👔</div>
                <div class="message-content">
                    Hello! I'm the HR Manager. How can I help you today?
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Type your message..."
                    onkeypress="handleKeyPress(event)"
                >
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration - Replace with your Lambda API URL
        const API_URL = 'https://1qbm73da9b.execute-api.ap-southeast-2.amazonaws.com/dev/ai/chat';

        let currentBossType = 'supportive';
        let conversationHistory = [];

        // User data
        const userData = {
            current_salary: 8000,
            market_average: 12000,
            experience: 3,
            position: 'Frontend Developer'
        };

        // Boss type switching
        document.querySelectorAll('.boss-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.boss-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentBossType = this.dataset.type;
                
                // Reset conversation
                conversationHistory = [];
                const chatArea = document.getElementById('chatArea');
                chatArea.innerHTML = `
                    <div class="message ai">
                        <div class="avatar">👔</div>
                        <div class="message-content">
                            Hello! I'm the HR Manager. How can I help you today?
                        </div>
                    </div>
                `;
            });
        });

        // Handle Enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Add message to chat area
        function addMessage(content, isUser) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            
            messageDiv.innerHTML = `
                <div class="avatar">${isUser ? '👤' : '👔'}</div>
                <div class="message-content">${content}</div>
            `;
            
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Show loading animation
        function showLoading() {
            const chatArea = document.getElementById('chatArea');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai';
            loadingDiv.id = 'loadingMessage';
            loadingDiv.innerHTML = `
                <div class="avatar">👔</div>
                <div class="message-content">
                    <div class="loading">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatArea.appendChild(loadingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Remove loading animation
        function removeLoading() {
            const loadingMessage = document.getElementById('loadingMessage');
            if (loadingMessage) {
                loadingMessage.remove();
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const message = input.value.trim();

            if (!message) return;

            // Disable input
            input.disabled = true;
            sendBtn.disabled = true;

            // Show user message
            addMessage(message, true);
            input.value = '';

            // Add to conversation history
            conversationHistory.push({
                role: 'user',
                content: message
            });

            // Show loading animation
            showLoading();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        boss_type: currentBossType,
                        message: message,
                        conversation_history: conversationHistory,
                        user_data: userData
                    })
                });

                const data = await response.json();

                // Remove loading animation
                removeLoading();

                if (data.success) {
                    const aiMessage = data.data.ai_message;
                    
                    // Add to conversation history
                    conversationHistory.push({
                        role: 'assistant',
                        content: aiMessage
                    });

                    // Show AI response
                    addMessage(aiMessage, false);
                } else {
                    addMessage('Sorry, an error occurred: ' + (data.error || 'Unknown error'), false);
                }
            } catch (error) {
                removeLoading();
                addMessage('Sorry, network connection failed. Please try again later.', false);
                console.error('Error:', error);
            }

            // Re-enable input
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    </script>
</body>
</html>
